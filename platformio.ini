[platformio]
src_dir = .

[env:d1_mini]
platform = espressif8266@4.0.1 ; Arduino core 3.0.2 (3.1.x is not supported by this sketch)
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    majicdesigns/MD_Parola
    majicdesigns/MD_MAX72XX
    tzapu/WiFiManager
    bblanchon/ArduinoJson
    thijse/ArduinoLog
    bblanchon/ArduinoTrace
    squix78/JsonStreamingParser
    yiannisbourkelis/Uptime Library
    paulstoffregen/Time
    jchristensen/Timezone
